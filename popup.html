<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; }
    h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input[type="url"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    input[type="url"]:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2); }
    .format-options { display: flex; gap: 8px; margin-bottom: 16px; }
    .format-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
    .format-btn:hover { border-color: #1a73e8; }
    .format-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .format-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .platform-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; }
    .platform-badge.instagram { background: #f09433; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }
    .platform-badge.facebook { background: #1877f2; color: #fff; }
    .platform-badge.threads { background: #000; color: #fff; }
    .platform-badge.youtube { background: #ff0000; color: #fff; }
    .platform-badge.tiktok { background: #000; color: #fff; }
    .platform-badge.twitter { background: #1da1f2; color: #fff; }
    .platform-badge.unknown { background: #666; color: #fff; }
    button#downloadBtn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button#downloadBtn:hover:not(:disabled) { background: #1557b0; }
    button#downloadBtn:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; white-space: pre-line; overflow-wrap: anywhere; }
    .status.success { background: #e6f4ea; color: #137333; display: block; }
    .status.error { background: #fce8e6; color: #c5221f; display: block; }
    .status.loading { background: #e8f0fe; color: #1a73e8; display: block; }
    .progress-bar { height: 3px; background: #1a73e8; border-radius: 3px; margin-top: 8px; transform-origin: left; transform: scaleX(0); transition: transform 0.2s; }
    .progress-bar.active { transform: scaleX(1); }
    .media-info { display: none; margin-top: 12px; padding: 12px; background: #f8f9fa; border-radius: 6px; }
    .media-info.visible { display: block; }
    .media-info img, .media-info video { max-width: 100%; border-radius: 4px; }
    .media-info .meta { margin-top: 8px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h3>Social Media Downloader</h3>
  
  <div class="input-group">
    <label for="urlInput">Video/Post URL</label>
    <input type="url" id="urlInput" placeholder="https://www.instagram.com/reel/..." spellcheck="false">
  </div>

  <div id="platformBadge" class="platform-badge unknown" style="display:none;">Unknown</div>

  <div class="format-options">
    <button type="button" class="format-btn active" data-format="mp4" id="btnMp4">MP4 (Video)</button>
    <button type="button" class="format-btn" data-format="mp3" id="btnMp3">MP3 (Audio)</button>
  </div>

  <div id="qualityGroup" style="display:none; margin-bottom: 12px;">
    <label for="qualitySelect">Quality</label>
    <select id="qualitySelect" style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; background:#fff;">
    </select>
  </div>

  <div id="audioGroup" style="display:none; margin-bottom: 12px;">
    <label for="audioSelect">Audio Format</label>
    <select id="audioSelect" style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; background:#fff;">
    </select>
  </div>

  <button id="downloadBtn" disabled>Fetch Info</button>

  <div id="status" class="status"></div>
  <div class="progress-bar" id="progressBar"></div>

  <div id="mediaInfo" class="media-info">
    <div id="mediaPreview"></div>
    <div class="meta" id="mediaMeta"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
