<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7v12m0 0l-5-5m5 5l5-5M9 24h14' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #14181f; --muted: #6a7280; --line: #e3e6eb;
  --accent: #2563eb; --accent-text: #fff; --ok: #15803d; --err: #b91c1c; --track: #e8ebf0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --card: #181c22; --text: #e8ebf0; --muted: #8b94a3; --line: #272d36;
          --accent: #3b82f6; --ok: #4ade80; --err: #f87171; --track: #272d36; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
header .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
header h1 { font-size: 20px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=text], select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
textarea { flex: 1 1 280px; min-height: 44px; resize: vertical; }
select { padding-right: 8px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 9px; padding: 9px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; padding: 10px 20px; }
button.small { padding: 5px 10px; font-size: 13px; }
button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.opts { display: flex; gap: 10px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.sites { margin-top: 12px; color: var(--muted); font-size: 13px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; }
h2 .spacer { flex: 1; }
.job { display: grid; gap: 6px; margin-bottom: 10px; }
.job .top { display: flex; gap: 10px; align-items: baseline; }
.job .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.job .msg { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.job.error .msg { color: var(--err); }
.job.done .msg { color: var(--ok); }
.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.job.done .bar > i { background: var(--ok); }
.job.error .bar > i, .job.cancelled .bar > i { background: var(--err); }
.job .actions { display: flex; gap: 6px; }
.empty { color: var(--muted); text-align: center; padding: 26px 0; }
footer { margin-top: 26px; color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
#toast.show { opacity: .95; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6v14m0 0l-6-6m6 6l6-6M8 26h16"/></svg></div>
    <div><h1>Save Tool</h1><div class="sub">Save videos from Threads, YouTube, Instagram, Facebook, TikTok, X and more</div></div>
    <div class="spacer"></div>
    <button class="small" id="folder">Open folder</button>
  </header>

  <section class="card">
    <div class="row">
      <textarea id="url" rows="1" placeholder="Paste one or more links here (one per line)" autofocus></textarea>
      <button class="primary" id="go">Download</button>
    </div>
    <div class="opts">
      <label>Save as
        <select id="kind"><option value="video">Video (MP4)</option><option value="audio">Audio only (MP3)</option></select>
      </label>
      <label id="qwrap">Quality
        <select id="quality"><option value="best">Best available</option><option value="1080">Up to 1080p</option><option value="720">Up to 720p</option><option value="480">Up to 480p</option></select>
      </label>
      <label>Login
        <select id="cookies" title="Needed for private, age-restricted or login-only videos">
          <option value="auto">cookies.txt if present</option><option value="none">None</option>
          <option value="chrome">Chrome</option><option value="edge">Edge</option>
          <option value="firefox">Firefox</option><option value="brave">Brave</option>
        </select>
      </label>
      <label><input type="checkbox" id="playlist"> Whole playlist</label>
      <span>Threads posts are always saved as-is. For Chrome/Edge, close the browser first.</span>
    </div>
  </section>

  <h2>Downloads <span class="spacer"></span><button class="small" id="clear">Clear finished</button></h2>
  <div id="jobs"><div class="empty">Nothing yet. Paste a link above.</div></div>

  <footer>
    <span id="where"></span>
    <span id="toolinfo"></span>
    <button class="small" id="update" title="Update yt-dlp if a site stopped working">Update</button>
  </footer>
</main>
<div id="toast" role="status"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, body) {
  const r = await fetch("/api/" + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "x-token": TOKEN, "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

function render(s) {
  $("where").textContent = "Saving to " + s.outDir;
  $("toolinfo").textContent = `v${s.version} · yt-dlp ${s.tools.ytdlp ? "ready" : "downloads on first use"} · ffmpeg ${s.tools.ffmpeg ? "ready" : "downloads on first use"}`;
  const box = $("jobs");
  if (!s.jobs.length) { box.innerHTML = '<div class="empty">Nothing yet. Paste a link above.</div>'; return; }
  // keep existing nodes where possible so buttons don't flicker while polling
  box.innerHTML = s.jobs.map(j => {
    const live = j.status === "queued" || j.status === "running";
    return `<div class="card job ${j.status}">
      <div class="top"><div class="title" title="${esc(j.url)}">${esc(j.title)}</div>
        <div class="actions">
          ${j.status === "done" ? `<button class="small" data-act="open" data-id="${j.id}">Show file</button>` : ""}
          ${live ? `<button class="small" data-act="cancel" data-id="${j.id}">Cancel</button>` : `<button class="small" data-act="remove" data-id="${j.id}">Remove</button>`}
        </div></div>
      <div class="bar"><i style="width:${j.status === "done" ? 100 : j.progress}%"></i></div>
      <div class="msg">${esc(j.message)}${live && j.progress ? ` · ${j.progress}%` : ""}</div>
    </div>`;
  }).join("");
}

async function poll() {
  try { render(await api("state")); } catch { $("toolinfo").textContent = "Save Tool app was closed. Start savetool.exe again."; }
}

async function start() {
  const url = $("url").value.trim();
  if (!url) { toast("Paste a link first."); return; }
  try {
    await api("jobs", { url, kind: $("kind").value, quality: $("quality").value, cookies: $("cookies").value, playlist: $("playlist").checked });
    $("url").value = ""; poll();
  } catch (e) { toast(e.message); }
}

$("go").onclick = start;
$("url").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); } });
$("kind").onchange = () => { $("qwrap").style.opacity = $("kind").value === "audio" ? .4 : 1; };
$("folder").onclick = () => api("folder", {});
$("clear").onclick = async () => {
  const s = await api("state");
  for (const j of s.jobs) if (!["queued", "running"].includes(j.status)) await api(`jobs/${j.id}/remove`, {});
  poll();
};
$("update").onclick = async () => {
  $("update").disabled = true; toast("Updating yt-dlp...");
  try { toast((await api("update", {})).message); } catch (e) { toast(e.message); }
  $("update").disabled = false; poll();
};
$("jobs").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  await api(`jobs/${b.dataset.id}/${b.dataset.act}`, {}); poll();
};

poll(); setInterval(poll, 900);
</script>
</body>
</html>
