<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3Cpath d='M16 7v12m0 0l-5-5m5 5l5-5M9 24h14' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #faf9f5; --card: #ffffff; --soft: #f0eee6; --text: #141413; --muted: #6b6a64; --line: #e5e2d6;
  --accent: #d97757; --accent-hover: #c6613f; --accent-text: #ffffff; --ok: #4d7c4d; --err: #b3402a; --track: #ece9de;
  --shadow: 0 1px 2px rgba(20,20,19,.04), 0 6px 24px rgba(20,20,19,.05);
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #262624; --card: #30302e; --soft: #3a3a37; --text: #faf9f5; --muted: #a6a59d; --line: #43433f;
          --ok: #8fc18f; --err: #ec8a72; --track: #43433f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 720px; margin: 0 auto; padding: 44px 18px 64px; }
header { text-align: center; margin-bottom: 28px; }
header .logo { width: 52px; height: 52px; margin: 0 auto 14px; display: block; }
header h1 { font: 500 34px/1.15 var(--serif); margin: 0 0 6px; letter-spacing: -.01em; }
header .sub { color: var(--muted); font-size: 15px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.box { padding: 14px 14px 12px; border-radius: 22px; }
.box:focus-within { border-color: var(--accent); }
.box textarea { display: block; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; resize: none; min-height: 56px; padding: 6px 6px 8px; }
.box textarea::placeholder { color: var(--muted); opacity: .8; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tools .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; background: var(--soft); border-radius: 999px; padding: 4px 6px 4px 12px; }
.pill select { font: inherit; color: var(--text); background: transparent; border: 0; outline: 0; padding: 3px 4px; cursor: pointer; }
.pill select option { background: var(--card); color: var(--text); }
.pill.check { padding: 7px 14px 7px 10px; cursor: pointer; user-select: none; }
.pill.check input { accent-color: var(--accent); margin: 0; }
.send { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.hint { color: var(--muted); font-size: 12.5px; margin: 10px 6px 0; }

button { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent-hover); }
.send:hover { background: var(--accent-hover); color: var(--accent-text); }
button.small { padding: 5px 11px; font-size: 13px; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible, select:focus-visible, .pill.check:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.where { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px 10px 16px; border-radius: 14px; box-shadow: none; }
.where svg { flex: none; color: var(--muted); }
.where .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; font-size: 13.5px; }
.where .lbl { color: var(--muted); font-size: 13px; flex: none; }

h2 { font: 500 19px var(--serif); margin: 34px 0 12px; display: flex; align-items: center; }
h2 .spacer { flex: 1; }
.job { display: grid; gap: 8px; margin-bottom: 10px; padding: 14px 16px; box-shadow: none; }
.job .top { display: flex; gap: 10px; align-items: center; }
.job .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.job .msg { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.job.error .msg { color: var(--err); }
.job.done .msg { color: var(--ok); }
.job .actions { display: flex; gap: 6px; }
.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; border-radius: 99px; }
.job.done .bar > i { background: var(--ok); }
.job.error .bar > i, .job.cancelled .bar > i { background: var(--err); }
.empty { color: var(--muted); text-align: center; padding: 30px 0; border: 1px dashed var(--line); border-radius: 16px; }
footer { margin-top: 30px; color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
footer .spacer { flex: 1; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
#toast.show { opacity: .96; }

@media (max-width: 600px) {
  main { padding: 26px 12px 48px; }
  header { margin-bottom: 20px; }
  header .logo { width: 44px; height: 44px; margin-bottom: 10px; }
  header h1 { font-size: 27px; }
  header .sub { font-size: 13.5px; }
  .box { padding: 12px 12px 10px; border-radius: 18px; }
  .tools { gap: 6px; }
  .pill { font-size: 12.5px; }
  .where { flex-wrap: wrap; gap: 6px 8px; padding: 10px 12px; }
  .where .path { order: 3; flex: 1 0 100%; direction: ltr; }
  .where .lbl { flex: 1; }
  .job { padding: 12px; }
  .job .top { flex-wrap: wrap; }
  .job .title { flex: 1 0 100%; white-space: normal; overflow-wrap: anywhere; }
  footer { justify-content: space-between; }
  footer #toolinfo { flex: 1 0 100%; }
  footer .spacer { display: none; }
}
@media (max-width: 380px) {
  .pill select { max-width: 120px; }
  h2 { font-size: 17px; }
}
</style>
</head>
<body>
<main>
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#d97757"/><path d="M32 13v24" stroke="#faf9f5" stroke-width="6" stroke-linecap="round"/><path d="M19 32h26L32 46z" fill="#faf9f5" stroke="#faf9f5" stroke-width="2" stroke-linejoin="round"/><path d="M19 52h26" stroke="#faf9f5" stroke-width="6" stroke-linecap="round"/></svg>
    <h1>Save Tool</h1>
    <div class="sub">Save videos from Threads, YouTube, Instagram, Facebook, TikTok, X and more</div>
  </header>

  <section class="card box">
    <textarea id="url" rows="2" placeholder="Paste one or more links here (one per line)" autofocus></textarea>
    <div class="tools">
      <label class="pill">Save as
        <select id="kind"><option value="video">Video (MP4)</option><option value="audio">Audio (MP3)</option></select>
      </label>
      <label class="pill" id="qwrap">Quality
        <select id="quality"><option value="best">Best</option><option value="1080">Up to 1080p</option><option value="720">Up to 720p</option><option value="480">Up to 480p</option></select>
      </label>
      <label class="pill" title="Needed for private, age-restricted or login-only videos">Login
        <select id="cookies">
          <option value="auto">cookies.txt if present</option><option value="none">None</option>
          <option value="chrome">Chrome</option><option value="edge">Edge</option>
          <option value="firefox">Firefox</option><option value="brave">Brave</option>
        </select>
      </label>
      <label class="pill check" title="If the link is a playlist, save every video in it into its own folder. Off = just the one video."><input type="checkbox" id="playlist"> Whole playlist</label>
      <span class="spacer"></span>
      <button class="send" id="go" title="Download" aria-label="Download"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-5-5m5 5l5-5M5 20h14"/></svg></button>
    </div>
  </section>
  <div class="hint">Threads posts are always saved as-is (a quote post saves the video it quotes). For Chrome/Edge login, close the browser first.</div>

  <section class="card where">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span class="lbl">Save to</span>
    <span class="path" id="where" title=""></span>
    <button class="small" id="choose">Change folder</button>
    <button class="small" id="folder">Open</button>
  </section>

  <h2>Downloads <span class="spacer"></span><button class="small" id="clear">Clear finished</button></h2>
  <div id="jobs"><div class="empty">Nothing yet. Paste a link above.</div></div>

  <footer>
    <span id="toolinfo"></span>
    <span class="spacer"></span>
    <button class="small" id="shortcut" title="Add Save Tool to your Desktop and Start menu">Add shortcut</button>
    <button class="small" id="update" title="Update yt-dlp if a site stopped working">Update</button>
  </footer>
</main>
<div id="toast" role="status"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, body) {
  const r = await fetch("/api/" + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "x-token": TOKEN, "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

function render(s) {
  $("where").textContent = s.outDir; $("where").title = s.outDir;
  $("toolinfo").textContent = `v${s.version}` + (s.setup.busy ? ` · ${s.setup.message} (first run only)` : s.setup.warning ? ` · ${s.setup.warning}` : "");
  const box = $("jobs");
  if (!s.jobs.length) { box.innerHTML = '<div class="empty">Nothing yet. Paste a link above.</div>'; return; }
  // keep existing nodes where possible so buttons don't flicker while polling
  box.innerHTML = s.jobs.map(j => {
    const live = j.status === "queued" || j.status === "running";
    return `<div class="card job ${j.status}">
      <div class="top"><div class="title" title="${esc(j.url)}">${esc(j.title)}</div>
        <div class="actions">
          ${j.status === "done" ? `<button class="small" data-act="open" data-id="${j.id}">Show file</button>` : ""}
          ${live ? `<button class="small" data-act="cancel" data-id="${j.id}">Cancel</button>` : `<button class="small" data-act="remove" data-id="${j.id}">Remove</button>`}
        </div></div>
      <div class="bar"><i style="width:${j.status === "done" ? 100 : j.progress}%"></i></div>
      <div class="msg">${esc(j.message)}${live && j.progress ? ` · ${j.progress}%` : ""}</div>
    </div>`;
  }).join("");
}

async function poll() {
  try { render(await api("state")); } catch { $("toolinfo").textContent = "Save Tool app was closed. Start savetool.exe again."; }
}

async function start() {
  const url = $("url").value.trim();
  if (!url) { toast("Paste a link first."); return; }
  try {
    await api("jobs", { url, kind: $("kind").value, quality: $("quality").value, cookies: $("cookies").value, playlist: $("playlist").checked });
    $("url").value = ""; poll();
  } catch (e) { toast(e.message); }
}

$("go").onclick = start;
$("url").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); } });
$("kind").onchange = () => { $("qwrap").style.opacity = $("kind").value === "audio" ? .4 : 1; };
$("folder").onclick = () => api("folder", {});
$("choose").onclick = async () => {
  $("choose").disabled = true; toast("Choose a folder in the window that opened...");
  try { const r = await api("choose-folder", {}); if (r.changed) toast("Saving to " + r.outDir); } catch (e) { toast(e.message); }
  $("choose").disabled = false; poll();
};
$("shortcut").onclick = async () => {
  try { toast((await api("shortcut", {})).message); } catch (e) { toast(e.message); }
};
$("clear").onclick = async () => {
  const s = await api("state");
  for (const j of s.jobs) if (!["queued", "running"].includes(j.status)) await api(`jobs/${j.id}/remove`, {});
  poll();
};
$("update").onclick = async () => {
  $("update").disabled = true; toast("Updating yt-dlp...");
  try { toast((await api("update", {})).message); } catch (e) { toast(e.message); }
  $("update").disabled = false; poll();
};
$("jobs").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  await api(`jobs/${b.dataset.id}/${b.dataset.act}`, {}); poll();
};

poll(); setInterval(poll, 900);
</script>
</body>
</html>
